<!--
  market-scan 리포트 스타일 가이드.
  실제 스캔을 리포트로 만들 때, 이 구조와 CSS를 그대로 재사용하고
  <!-- {{...}} --> 자리만 그 스캔의 실제 내용으로 채운다.
  라벨 색상: 1차=파랑, 2차=회색, 추정=주황. 판단/전망 문구는 절대 넣지 않는다.
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><!-- {{산업/테마}} 스캔 — {{날짜}} --></title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #17181c; --bg: #fbfbfc; --surface: #ffffff;
    --muted: #6b7076; --border: #e6e7ea; --accent: #3357e0; --accent-soft: #eef1fd;
    --tag-1: #2563eb; --tag-1-bg: #e8edfd;
    --tag-2: #6b7076; --tag-2-bg: #eef0f2;
    --tag-est: #b45309; --tag-est-bg: #fdf3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #eceef1; --bg: #101114; --surface: #17181d;
      --muted: #9297a1; --border: #2a2c32; --accent: #7c96ff; --accent-soft: #1b2036;
      --tag-1: #8fa6ff; --tag-1-bg: #1c2340;
      --tag-2: #9297a1; --tag-2-bg: #23252b;
      --tag-est: #e2a94f; --tag-est-bg: #2c2313;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", "Pretendard", sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 3rem 1.4rem 5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.3rem; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
  section { margin-top: 2.4rem; }
  h2 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  .synthesis {
    background: var(--accent-soft); border-radius: 10px; padding: 1.1rem 1.3rem;
    font-size: 0.98rem;
  }
  .claim-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.1rem 1.3rem; margin-bottom: 0.9rem;
  }
  .claim-text { font-weight: 600; margin: 0 0 0.5rem; }
  .plain { color: var(--muted); font-size: 0.92rem; margin: 0.4rem 0; }
  .plain::before { content: "쉽게 말하면 — "; color: var(--fg); font-weight: 600; }
  .src-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }
  .tag { border-radius: 999px; padding: 0.15rem 0.6rem; font-weight: 600; font-size: 0.75rem; }
  .tag.p1 { color: var(--tag-1); background: var(--tag-1-bg); }
  .tag.p2 { color: var(--tag-2); background: var(--tag-2-bg); }
  .tag.est { color: var(--tag-est); background: var(--tag-est-bg); }
  ul.plain-list { padding-left: 1.2rem; color: var(--muted); font-size: 0.92rem; }
  .print-hint { margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.82rem; }
</style>
</head>
<body>
<main>
  <h1><!-- {{산업/테마}} 스캔 --></h1>
  <p class="meta"><!-- {{날짜}} · market-scan --></p>

  <section>
    <h2>종합</h2>
    <div class="synthesis">
      <!-- 이 스캔의 핵심 사건들이 서로 어떻게 연결되는지 서술형 한 문단.
           예: "A가 짓겠다는 계획과 B라는 제약이 같은 시기에 나오고 있다."
           판단·전망·추천 문구는 쓰지 않는다. -->
    </div>
  </section>

  <section>
    <h2>핵심 주장</h2>
    <!-- 주장마다 하나씩 반복 -->
    <div class="claim-card">
      <p class="claim-text"><!-- {{주장 — 수치·핵심 내용}} --></p>
      <p class="plain"><!-- {{용어·약어 풀이 + 배경 맥락. 전망/판단 금지}} --></p>
      <div class="src-row">
        <span class="tag p1"><!-- 1차 / 2차 / 추정 중 하나만 --></span>
        <span><!-- {{출처}} --></span>
      </div>
    </div>
  </section>

  <section>
    <h2>믿기 어려운 점 / 교차확인 안 된 것</h2>
    <ul class="plain-list">
      <li><!-- {{항목 — 이유}} --></li>
    </ul>
  </section>

  <section>
    <h2>Unknowns</h2>
    <ul class="plain-list">
      <li><!-- {{모르는 것 — 확인 방법}} --></li>
    </ul>
  </section>

  <p class="print-hint">이 파일은 더블클릭으로 바로 열립니다. PDF로 저장하려면 브라우저에서 열고 Cmd/Ctrl+P → PDF로 저장을 누르세요.</p>
</main>
</body>
</html>
